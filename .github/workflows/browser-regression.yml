name: Browser regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  chrome:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit and storage tests
        run: node --test tests/*.test.cjs
      - name: Real Chrome regression
        run: node --test tests/browser/*.test.cjs
