<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="返信とToDo依頼の使い方">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg3)"/>
  <text x="54" y="72" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="38" font-weight="900" fill="#0f172a">返信・ToDo依頼</text>
  <text x="56" y="112" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="700" fill="#475569">行から反応や依頼を作ると、連絡帳に進捗スタンプが残ります</text>

  <rect x="72" y="154" width="820" height="104" rx="24" fill="#fff" filter="url(#shadow3)"/>
  <rect x="104" y="184" width="68" height="40" rx="20" fill="#22c55e"/>
  <text x="124" y="212" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="22" font-weight="900" fill="#fff">4号L</text>
  <text x="198" y="213" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="26" font-weight="900" fill="#0f172a">6S実施</text>
  <g transform="translate(626 180)">
    <rect width="46" height="46" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="13" y="31" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#1d4ed8">↩</text>
    <rect x="58" width="46" height="46" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="73" y="31" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#c2410c">依</text>
    <rect x="116" width="46" height="46" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
    <text x="131" y="31" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#dc2626">重</text>
  </g>

  <g transform="translate(106 304)">
    <rect width="340" height="132" rx="24" fill="#ffffff" filter="url(#shadow3)"/>
    <text x="34" y="48" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="26" font-weight="900" fill="#0f172a">返信ボタン</text>
    <text x="34" y="88" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="700" fill="#475569">下に返信行が入り、誰が反応したか</text>
    <text x="34" y="114" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="700" fill="#475569">人名スタンプで残せます</text>
  </g>
  <g transform="translate(514 304)">
    <rect width="340" height="132" rx="24" fill="#ffffff" filter="url(#shadow3)"/>
    <text x="34" y="48" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="26" font-weight="900" fill="#0f172a">依頼ボタン</text>
    <text x="34" y="88" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="700" fill="#475569">ToDoへ依頼し、進行中・完了が</text>
    <text x="34" y="114" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="700" fill="#475569">連絡帳にもスタンプで戻ります</text>
  </g>
</svg>
