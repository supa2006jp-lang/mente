    <rect x="528" y="106" width="42" height="28" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="541" y="126" font-size="16" font-weight="900" fill="#c2410c">写</text>

    <circle cx="58" cy="184" r="16" fill="#ef4444"/>
    <text x="84" y="191" font-size="18" font-weight="900" fill="#0f172a">ドカ停・非生産停止</text>
    <text x="264" y="191" font-size="15" font-weight="800" fill="#64748b">重い停止を一覧で追跡</text>
    <rect x="508" y="170" width="62" height="28" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
