<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="テンプレートとグループスタンプの使い方">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg2)"/>
  <text x="54" y="72" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="38" font-weight="900" fill="#0f172a">テンプレートと行挿入</text>
  <text x="56" y="112" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="700" fill="#475569">よく使う行の組み合わせを登録して、すばやく呼び出します</text>

  <rect x="64" y="148" width="832" height="96" rx="24" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="96" y="185" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#1e3a8a">行挿入用看板</text>
  <g transform="translate(94 198)">
    <rect width="92" height="42" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="21" y="29" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#0f172a">未設定</text>
    <rect x="112" width="112" height="42" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="132" y="29" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#92400e">貫通表示</text>
    <rect x="244" width="88" height="42" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="264" y="29" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#166534">4号L</text>
    <rect x="352" width="88" height="42" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="372" y="29" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="20" font-weight="900" fill="#c2410c">5号L</text>
  </g>
  <path d="M560 218 C610 218 620 315 685 315" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 14"/>
  <polygon points="685,315 652,298 660,334" fill="#2563eb"/>

  <rect x="124" y="314" width="282" height="130" rx="24" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="158" y="358" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="26" font-weight="900" fill="#0f172a">ドラッグして挿入</text>
  <text x="158" y="398" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="700" fill="#475569">入れたい場所に補助線が出ます</text>

  <rect x="532" y="300" width="292" height="158" rx="24" fill="#ffffff" filter="url(#shadow2)"/>
  <rect x="562" y="330" width="104" height="34" rx="17" fill="#22c55e"/>
  <text x="589" y="353" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="19" font-weight="900" fill="#fff">4号L</text>
  <rect x="562" y="382" width="232" height="44" rx="12" fill="#f8fafc" stroke="#93c5fd" stroke-width="3"/>
  <text x="584" y="412" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="22" font-weight="900" fill="#0f172a">空行が入る</text>
</svg>
