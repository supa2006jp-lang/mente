<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitmap Tracer & Edge Detector</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
</head>

<body>
    <div class="app-container">
        <header>
            <h1>✨ Bitmap Tracer</h1>
            <p>画像をアップロードして、白黒ビットマップやエッジ（輪郭）を抽出します。</p>
        </header>

        <!-- Stepper Indicator -->
        <div class="stepper-container">
            <div class="step-item active" id="stepIndicator1">
                <div class="step-circle">1</div>
                <div class="step-label">画像アップロード</div>
            </div>
            <div class="step-item" id="stepIndicator2">
                <div class="step-circle">2</div>
                <div class="step-label">モード選択</div>
            </div>
            <div class="step-item" id="stepIndicator3">
                <div class="step-circle">3</div>
                <div class="step-label">パラメーター調整</div>
            </div>
            <div class="step-item" id="stepIndicator4">
                <div class="step-circle">4</div>
                <div class="step-label">出力 & パターン生成</div>
            </div>
        </div>

        <div class="toolbar glass-panel">
            <!-- Step 1: Upload -->
            <div class="toolbar-step active" id="stepContent1">
                <div class="control-group" style="align-items: center; width: 100%; padding: 2rem;">
                    <label for="imageUpload" class="custom-file-upload" style="font-size: 1.2rem; padding: 1rem 2rem;">
                        📂 画像を選択して開始
                    </label>
                    <input type="file" id="imageUpload" accept="image/*">
                    <p style="margin-top: 1rem; opacity: 0.6; font-size: 0.9rem;">JPG, PNG, WebP に対応しています</p>
                </div>
            </div>

            <!-- Step 2: Mode -->
            <div class="toolbar-step" id="stepContent2">
                <div class="control-group">
                    <label for="modeSelect" style="font-size: 1rem;">変換モードを選択してください:</label>
                    <select id="modeSelect" style="font-size: 1.1rem; padding: 0.75rem;">
                        <option value="threshold">白黒2値化 (Threshold)</option>
                        <option value="edge" selected>輪郭抽出 (Edge Trace)</option>
                        <option value="dither">誤差拡散ディザリング (Dither)</option>
                        <option value="bayer">網点ハーフトーン (Bayer)</option>
                        <option value="color">フルカラー (Color Vector)</option>
                    </select>
                </div>
            </div>

            <!-- Step 3: Adjust -->
            <div class="toolbar-step" id="stepContent3">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; width: 100%;">
                    <div class="control-group">
                        <label for="thresholdSlider">しきい値/感度: <span id="thresholdValue">128</span></label>
                        <input type="range" id="thresholdSlider" min="0" max="255" value="128">
                    </div>

                    <div class="control-group" id="edgeThicknessGroup">
                        <label for="edgeThicknessSlider">線の太さ調整: </label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="range" id="edgeThicknessSlider" min="-5" max="5" value="0" step="0.5" style="flex-grow: 1;">
                            <input type="number" id="edgeThicknessValue" min="-5" max="5" step="0.5" value="0"
                                style="width: 60px; text-align: right; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 2px 4px;">
                        </div>
                        <button id="btnThickenThinLines" class="secondary-btn" style="width: 100%; margin-top: 6px; font-size: 0.85em;">細い線を太くする</button>
                    </div>

                    <div class="control-group">
                        <label for="gapFillSlider">隙間埋め: </label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="range" id="gapFillSlider" min="0" max="5" value="0" step="0.5" style="flex-grow: 1;">
                            <input type="number" id="gapFillValue" min="0" max="5" step="0.5" value="0"
                                style="width: 60px; text-align: right; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 2px 4px;">
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="checkbox-label" style="margin: 0;">
                            <input type="checkbox" id="invertCheckbox">
                            白黒反転 (Invert)
                        </label>
                        <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 10px;">
                            <button id="flipHorizontalBtn" class="secondary-btn" title="左右反転" style="flex: 1;">↔️</button>
                            <button id="flipVerticalBtn" class="secondary-btn" title="上下反転" style="flex: 1;">↕️</button>
                            <button id="resetImageBtn" class="secondary-btn" title="リセット" style="flex: 1; color: #ef4444;">🔄</button>
                        </div>
                    </div>

                    <div class="control-group" id="whiteFillGroup" style="border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                        <label>🧹 明るい部分を白塗り除去</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center; margin: 8px 0;">
                            <input type="range" id="whiteFillSlider" min="0" max="255" value="200" style="flex-grow: 1;">
                            <span id="whiteFillValue" style="width: 30px; text-align: right; font-size: 0.9em;">200</span>
                        </div>
                        <button id="btnWhiteFill" class="secondary-btn" style="width: 100%; background-color: #f8fafc; color: #0f172a; font-weight: bold;">実行</button>
                    </div>

                    <div class="control-group" id="blackFillGroup" style="border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                        <label>🖋️ 暗い部分を黒塗り</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center; margin: 8px 0;">
                            <input type="range" id="blackFillSlider" min="0" max="255" value="128" style="flex-grow: 1;">
                            <span id="blackFillValue" style="width: 30px; text-align: right; font-size: 0.9em;">128</span>
                        </div>
                        <button id="btnBlackFill" class="secondary-btn" style="width: 100%; background-color: #0f172a; color: #f8fafc; border: 1px solid rgba(255,255,255,0.3); font-weight: bold;">実行</button>
                    </div>
                </div>
            </div>

            <!-- Step 4: Output -->
            <div class="toolbar-step" id="stepContent4">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; width: 100%;">
                    <div class="control-group">
                        <label>📐 出力設定 (mm)</label>
                        <div style="display: flex; gap: 0.8rem; align-items: center;">
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <span style="font-size: 0.8em; opacity: 0.7;">W:</span>
                                <input type="number" id="outputWidth" value="100" style="width: 70px;">
                            </div>
                            <div style="display: flex; align-items: center; gap: 4px;">
                                <span style="font-size: 0.8em; opacity: 0.7;">H:</span>
                                <input type="number" id="outputHeight" value="100" style="width: 70px;">
                            </div>
                            <label class="checkbox-label" style="margin: 0; font-size: 0.8em;">
                                <input type="checkbox" id="keepAspectCheckbox"> 比率維持
                            </label>
                        </div>

                        <label style="margin-top: 1rem;">🧩 パターン配置</label>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label class="checkbox-label" style="margin: 0;">
                                <input type="checkbox" id="halfStepCheckbox" checked> ハーフステップ (リピート)
                            </label>
                            <label class="checkbox-label" style="margin: 0;">
                                <input type="checkbox" id="singleItemCheckbox"> 模様を1個だけ表示
                            </label>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <label class="checkbox-label" style="margin: 0;">
                                    <input type="checkbox" id="useGridCountCheckbox" checked> 配置数:
                                </label>
                                <div id="gridCountGroup" style="display: flex; gap: 4px; align-items: center;">
                                    <input type="number" id="patternCols" value="5" min="1" style="width: 50px;">
                                    <span>×</span>
                                    <input type="number" id="patternRows" value="5" min="1" style="width: 50px;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="vectorStrokeWidthSlider">✏️ ベクター線の太さ補正</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="range" id="vectorStrokeWidthSlider" min="0" max="5" step="0.25" value="1" style="flex-grow: 1;">
                            <span id="vectorStrokeWidthValue" style="width: 30px; text-align: right; font-size: 0.9em;">1</span>
                        </div>
                        <div class="control-group" id="manualScaleGroup" style="margin-top: 10px;">
                            <label>🔍 大きさ調整 (%)</label>
                            <input type="number" id="manualScalePercent" min="1" step="1" value="100" style="width: 100px;">
                        </div>
                    </div>

                    <div class="control-group" style="justify-content: flex-end; gap: 1rem;">
                        <button id="downloadBtn" class="primary-btn" style="background-color: #475569;">💾 PNG保存</button>
                        <button id="generateSvgBtn" class="primary-btn" style="background-color: #8b5cf6;">🎨 SVG生成 & プレビュー</button>
                        <button id="downloadSvgBtn" class="primary-btn" style="background-color: #10b981; display: none;">💾 SVG保存</button>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="step-navigation">
                <button id="prevStepBtn" class="nav-btn" disabled>
                    <span>←</span> 戻る
                </button>
                <button id="nextStepBtn" class="nav-btn primary">
                    次へ <span>→</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="workspace workspace-main">
            <div class="canvas-container glass-panel">
                <h3>Original Image <span id="originalSizeInfo"
                        style="font-size: 0.8em; color: var(--text-secondary); font-weight: 400; margin-left: 0.5rem;"></span>
                </h3>
                <div class="canvas-wrapper">
                    <canvas id="originalCanvas"></canvas>
                    <div class="placeholder" id="originalPlaceholder">Image will appear here</div>
                </div>
            </div>

            <div class="canvas-container glass-panel">
                <h3 style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span style="display: flex; align-items: center;">Traced Result
                        <span id="resultSizeInfo"
                            style="font-size: 0.8em; color: var(--text-secondary); font-weight: 400; margin-left: 0.5rem; margin-right: 1rem;"></span>
                        <div style="display: flex; gap: 4px;">
                            <button id="btnUndo" class="secondary-btn"
                                style="padding: 2px 8px; font-size: 0.8em; border-radius: 4px;" disabled>↩️ 戻る</button>
                            <button id="btnRedo" class="secondary-btn"
                                style="padding: 2px 8px; font-size: 0.8em; border-radius: 4px;" disabled>↪️ 進む</button>
                        </div>
                    </span>

                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <label
                            style="font-size: 0.9em; font-weight: normal; color: var(--text-secondary); cursor: pointer;"
                            title="クリックした赤いクロスの中心周辺をペンとして黒く塗りつぶします">
                            <input type="checkbox" id="penCheckbox"> ✏️ ペン (2x2px)
                        </label>
                        <label
                            style="font-size: 0.9em; font-weight: normal; color: var(--text-secondary); cursor: pointer;"
                            title="クリックした赤いクロスの中心周辺を消しゴムとして消去します">
                            <input type="checkbox" id="eraserCheckbox"> 🧽 消しゴム (2x2px)
                        </label>
                        <label
                            style="font-size: 0.9em; font-weight: normal; color: var(--text-secondary); cursor: pointer;"
                            title="プレビュー画面上にマウスを乗せると部分拡大表示されます">
                            🔍 拡大レンズ: <input type="number" id="magnifierZoom" value="200" min="100" step="10"
                                style="width: 60px; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--panel-border); background-color: rgba(255, 255, 255, 0.1); color: white; text-align: right;">
                            %
                        </label>
                    </div>
                </h3>
                <div class="canvas-wrapper" style="position: relative;">
                    <canvas id="resultCanvas" style="cursor: crosshair;"></canvas>
                    <canvas id="magnifierCanvas"
                        style="position: absolute; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none; display: none; z-index: 10;"></canvas>

                    <div id="eraserControls"
                        style="position: absolute; display: none; background: rgba(30, 30, 40, 0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 12px; z-index: 20; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex-direction: column; align-items: center;">
                        <span style="font-size: 0.8em; color: var(--text-secondary); margin-bottom: 6px;">1px微調整</span>
                        <div
                            style="display: grid; grid-template-columns: 32px 32px 32px; gap: 4px; margin-bottom: 8px;">
                            <div></div>
                            <button id="btnEraseUp" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">🔼</button>
                            <div></div>
                            <button id="btnEraseLeft" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">◀️</button>
                            <div></div>
                            <button id="btnEraseRight" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">▶️</button>
                            <div></div>
                            <button id="btnEraseDown" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">🔽</button>
                            <div></div>
                        </div>
                        <button id="btnEraseCommit" class="primary-btn"
                            style="width: 100%; padding: 6px; font-size: 0.9em; background-color: #ef4444; border-color: #dc2626; margin-bottom: 4px;">🧽
                            消去</button>
                        <button id="btnDrawCommit" class="primary-btn"
                            style="width: 100%; padding: 6px; font-size: 0.9em; background-color: #3b82f6; border-color: #2563eb;">✏️
                            描画</button>
                    </div>

                    <div class="placeholder" id="resultPlaceholder">Result will appear here</div>
                </div>
            </div>
            </div>
    
            <div class="workspace preview-sidebar">
                <div class="canvas-container glass-panel"
                    style="display: flex; flex-direction: column; align-items: center;">
                    <h3 style="margin-bottom: 1.5rem;">Continuous SVG Pattern Preview</h3>
                    <div class="canvas-wrapper pattern-canvas-wrapper" id="previewWrapper"
                        style="width: 100%; height: 500px; background-color: #ffffff; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;">
                        <div class="placeholder" id="patternPlaceholder" style="position: static;">SVG Pattern will appear
                            here</div>
                        <div id="patternPreview"
                            style="display: none; width: 100%; height: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5);"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
