<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitmap Tracer & Edge Detector</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
</head>

<body>
    <div class="app-container">
        <header>
            <h1>✨ Bitmap Tracer</h1>
            <p>画像をアップロードして、白黒ビットマップやエッジ（輪郭）を抽出します。</p>
        </header>

        <div class="toolbar glass-panel">
            <div class="control-group">
                <label for="imageUpload" class="custom-file-upload">
                    📂 画像を選択
                </label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <div class="control-group">
                <label for="modeSelect">モード:</label>
                <select id="modeSelect">
                    <option value="threshold">白黒2値化 (Threshold)</option>
                    <option value="edge" selected>輪郭抽出 (Edge Trace)</option>
                    <option value="dither">誤差拡散ディザリング (Dither)</option>
                    <option value="bayer">網点ハーフトーン (Bayer)</option>
                    <option value="color">フルカラー (Color Vector)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="thresholdSlider">しきい値/感度: <span id="thresholdValue">128</span></label>
                <input type="range" id="thresholdSlider" min="0" max="255" value="128">
            </div>

            <div class="control-group" id="edgeThicknessGroup">
                <label for="edgeThicknessSlider">線の太さ/細さ調整: </label>
                <input type="number" id="edgeThicknessValue" min="-5" max="5" step="0.5" value="0"
                    style="width: 60px; text-align: right; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 2px 4px; display: inline-block;">
                <input type="range" id="edgeThicknessSlider" min="-5" max="5" value="0" step="0.5">

                <button id="btnThickenThinLines" class="secondary-btn"
                    style="width: 100%; margin-top: 6px; padding: 6px; font-size: 0.95em; border-radius: 4px;">細い線だけ2倍に太くする</button>
            </div>

            <div class="control-group" id="whiteFillGroup"
                style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 5px;">
                <label for="whiteFillSlider" style="margin-bottom: 6px;">🧹 明るい部分を白塗り除去</label>
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 0.8em; opacity: 0.7;">感度:</span>
                    <input type="range" id="whiteFillSlider" min="0" max="255" value="200" style="flex-grow: 1;">
                    <span id="whiteFillValue" style="width: 30px; text-align: right; font-size: 0.9em;">200</span>
                </div>
                <button id="btnWhiteFill" class="secondary-btn"
                    style="width: 100%; padding: 6px; font-size: 0.95em; background-color: #f8fafc; color: #0f172a; border-radius: 4px; font-weight: bold;">白塗り実行</button>
            </div>

            <div class="control-group" id="blackFillGroup"
                style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 5px;">
                <label for="blackFillSlider" style="margin-bottom: 6px;">🖋️ 暗い部分を黒塗りする（元線の復元）</label>
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 0.8em; opacity: 0.7;">感度:</span>
                    <input type="range" id="blackFillSlider" min="0" max="255" value="128" style="flex-grow: 1;">
                    <span id="blackFillValue" style="width: 30px; text-align: right; font-size: 0.9em;">128</span>
                </div>
                <button id="btnBlackFill" class="secondary-btn"
                    style="width: 100%; padding: 6px; font-size: 0.95em; background-color: #0f172a; color: #f8fafc; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; font-weight: bold;">黒塗り実行</button>
            </div>

            <div class="control-group">
                <label for="gapFillSlider">途切れた線の補修 (隙間埋め): </label>
                <input type="number" id="gapFillValue" min="0" max="5" step="0.5" value="0"
                    style="width: 60px; text-align: right; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 2px 4px; display: inline-block;">
                <input type="range" id="gapFillSlider" min="0" max="5" value="0" step="0.5">
            </div>


            <div class="control-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="invertCheckbox">
                    反転 (Invert)
                </label>
            </div>

            <div class="control-group" style="display: flex; gap: 0.5rem; align-items: center;">
                <button id="flipHorizontalBtn" class="secondary-btn" title="左右反転">↔️</button>
                <button id="flipVerticalBtn" class="secondary-btn" title="上下反転">↕️</button>
                <button id="resetImageBtn" class="secondary-btn" title="画像を初期状態にリセット"
                    style="margin-left: auto; color: #ef4444; border-color: rgba(239, 68, 68, 0.4);">🔄 リセット</button>
            </div>

            <div class="control-group">
                <button id="downloadBtn" class="primary-btn">💾 保存 (PNG)</button>
            </div>

            <div class="control-group"
                style="margin-left: max(0px, 1rem); border-left: 1px solid var(--panel-border); padding-left: 1.5rem;">
                <div style="display: flex; flex-direction: column; gap: 0.8rem;">

                    <label class="checkbox-label" style="margin-top: 0;">
                        <input type="checkbox" id="halfStepCheckbox" checked>
                        左右ハーフステップ (無限連続)
                    </label>

                    <label class="checkbox-label" style="margin-top: 0;">
                        <input type="checkbox" id="singleItemCheckbox">
                        模様を1個だけ表示する
                    </label>

                    <div>
                        <label class="checkbox-label" style="margin-top: 0; margin-bottom: 0.4rem;">
                            <input type="checkbox" id="useGridCountCheckbox" checked>
                            配置数でサイズを指定する (横 × 縦)
                        </label>
                        <div id="gridCountGroup"
                            style="display: flex; gap: 0.5rem; align-items: center; margin-left: 1.8rem; transition: opacity 0.3s;">
                            <input type="number" id="patternCols" value="5" min="1"
                                style="width: 70px; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--panel-border); background-color: rgba(0, 0, 0, 0.2); color: var(--text-primary); text-align: center;">
                            <span>×</span>
                            <input type="number" id="patternRows" value="5" min="1"
                                style="width: 70px; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--panel-border); background-color: rgba(0, 0, 0, 0.2); color: var(--text-primary); text-align: center;">
                        </div>
                    </div>

                    <label class="checkbox-label" style="margin-top: 0;">
                        <input type="checkbox" id="keepAspectCheckbox">
                        元画像のアスペクト比を維持
                    </label>
                </div>
            </div>

            <div class="control-group" id="manualScaleGroup"
                style="margin-left: max(0px, 1rem); border-left: 1px solid var(--panel-border); padding-left: 1.5rem; opacity: 0.5; pointer-events: none; transition: opacity 0.3s;">
                <label for="manualScalePercent">🔍 大きさ調整 (%)</label>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="number" id="manualScalePercent" min="1" step="1" value="100"
                        style="width: 90px; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--panel-border); background-color: rgba(0, 0, 0, 0.2); color: var(--text-primary); text-align: right;">
                    <span>%</span>
                </div>
            </div>

            <div class="control-group"
                style="margin-left: max(0px, 1rem); border-left: 1px solid var(--panel-border); padding-left: 1.5rem;">
                <label>出力サイズ (mm)</label>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <span style="font-size: 0.9em; opacity: 0.8;">W:</span>
                    <input type="number" id="outputWidth" value="100"
                        style="width: 80px; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--panel-border); background-color: rgba(0, 0, 0, 0.2); color: var(--text-primary); text-align: center;">
                    <span style="font-size: 0.9em; opacity: 0.8; margin-left: 0.5rem;">H:</span>
                    <input type="number" id="outputHeight" value="100"
                        style="width: 80px; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--panel-border); background-color: rgba(0, 0, 0, 0.2); color: var(--text-primary); text-align: center;">
                </div>
            </div>

            <div class="control-group"
                style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; margin-top: 5px;">
                <label for="vectorStrokeWidthSlider" style="margin-bottom: 6px;">✏️ ベクター線の太さ補正</label>
                <div style="font-size: 0.8em; color: var(--text-secondary); margin-bottom: 8px;">
                    SVG変換時に線が細くなるのを防いだり、さらに太く肉付けしたりできます。
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 0.8em; opacity: 0.7;">太さ(px):</span>
                    <input type="range" id="vectorStrokeWidthSlider" min="0" max="5" step="0.25" value="1"
                        style="flex-grow: 1;">
                    <span id="vectorStrokeWidthValue" style="width: 30px; text-align: right; font-size: 0.9em;">1</span>
                </div>
            </div>

            <div class="control-group">
                <button id="generateSvgBtn" class="primary-btn" style="background-color: #8b5cf6;">🎨 SVGトレース &
                    パターン生成</button>
            </div>

            <div class="control-group">
                <button id="downloadSvgBtn" class="primary-btn" style="background-color: #10b981; display: none;">💾 保存
                    (SVG)</button>
            </div>
        </div>

        <div class="main-content">
            <div class="workspace workspace-main">
            <div class="canvas-container glass-panel">
                <h3>Original Image <span id="originalSizeInfo"
                        style="font-size: 0.8em; color: var(--text-secondary); font-weight: 400; margin-left: 0.5rem;"></span>
                </h3>
                <div class="canvas-wrapper">
                    <canvas id="originalCanvas"></canvas>
                    <div class="placeholder" id="originalPlaceholder">Image will appear here</div>
                </div>
            </div>

            <div class="canvas-container glass-panel">
                <h3 style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span style="display: flex; align-items: center;">Traced Result
                        <span id="resultSizeInfo"
                            style="font-size: 0.8em; color: var(--text-secondary); font-weight: 400; margin-left: 0.5rem; margin-right: 1rem;"></span>
                        <div style="display: flex; gap: 4px;">
                            <button id="btnUndo" class="secondary-btn"
                                style="padding: 2px 8px; font-size: 0.8em; border-radius: 4px;" disabled>↩️ 戻る</button>
                            <button id="btnRedo" class="secondary-btn"
                                style="padding: 2px 8px; font-size: 0.8em; border-radius: 4px;" disabled>↪️ 進む</button>
                        </div>
                    </span>

                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <label
                            style="font-size: 0.9em; font-weight: normal; color: var(--text-secondary); cursor: pointer;"
                            title="クリックした赤いクロスの中心周辺をペンとして黒く塗りつぶします">
                            <input type="checkbox" id="penCheckbox"> ✏️ ペン (2x2px)
                        </label>
                        <label
                            style="font-size: 0.9em; font-weight: normal; color: var(--text-secondary); cursor: pointer;"
                            title="クリックした赤いクロスの中心周辺を消しゴムとして消去します">
                            <input type="checkbox" id="eraserCheckbox"> 🧽 消しゴム (2x2px)
                        </label>
                        <label
                            style="font-size: 0.9em; font-weight: normal; color: var(--text-secondary); cursor: pointer;"
                            title="プレビュー画面上にマウスを乗せると部分拡大表示されます">
                            🔍 拡大レンズ: <input type="number" id="magnifierZoom" value="200" min="100" step="10"
                                style="width: 60px; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--panel-border); background-color: rgba(255, 255, 255, 0.1); color: white; text-align: right;">
                            %
                        </label>
                    </div>
                </h3>
                <div class="canvas-wrapper" style="position: relative;">
                    <canvas id="resultCanvas" style="cursor: crosshair;"></canvas>
                    <canvas id="magnifierCanvas"
                        style="position: absolute; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none; display: none; z-index: 10;"></canvas>

                    <div id="eraserControls"
                        style="position: absolute; display: none; background: rgba(30, 30, 40, 0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 12px; z-index: 20; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex-direction: column; align-items: center;">
                        <span style="font-size: 0.8em; color: var(--text-secondary); margin-bottom: 6px;">1px微調整</span>
                        <div
                            style="display: grid; grid-template-columns: 32px 32px 32px; gap: 4px; margin-bottom: 8px;">
                            <div></div>
                            <button id="btnEraseUp" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">🔼</button>
                            <div></div>
                            <button id="btnEraseLeft" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">◀️</button>
                            <div></div>
                            <button id="btnEraseRight" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">▶️</button>
                            <div></div>
                            <button id="btnEraseDown" class="secondary-btn"
                                style="padding: 0; height: 32px; font-size: 1.2em;">🔽</button>
                            <div></div>
                        </div>
                        <button id="btnEraseCommit" class="primary-btn"
                            style="width: 100%; padding: 6px; font-size: 0.9em; background-color: #ef4444; border-color: #dc2626; margin-bottom: 4px;">🧽
                            消去</button>
                        <button id="btnDrawCommit" class="primary-btn"
                            style="width: 100%; padding: 6px; font-size: 0.9em; background-color: #3b82f6; border-color: #2563eb;">✏️
                            描画</button>
                    </div>

                    <div class="placeholder" id="resultPlaceholder">Result will appear here</div>
                </div>
            </div>
            </div>
    
            <div class="workspace preview-sidebar">
                <div class="canvas-container glass-panel"
                    style="display: flex; flex-direction: column; align-items: center;">
                    <h3 style="margin-bottom: 1.5rem;">Continuous SVG Pattern Preview</h3>
                    <div class="canvas-wrapper pattern-canvas-wrapper" id="previewWrapper"
                        style="width: 100%; height: 500px; background-color: #ffffff; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;">
                        <div class="placeholder" id="patternPlaceholder" style="position: static;">SVG Pattern will appear
                            here</div>
                        <div id="patternPreview"
                            style="display: none; width: 100%; height: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5);"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
